<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fde047"/>
      <stop offset="100%" style="stop-color:#facc15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="white" fill-opacity="0.05"/>
  <circle cx="1100" cy="530" r="200" fill="white" fill-opacity="0.05"/>
  <circle cx="900" cy="100" r="80" fill="white" fill-opacity="0.03"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Content -->
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="90" font-weight="bold" fill="white" text-anchor="middle">Zain Bagus</text>

  <text x="600" y="320" font-family="Arial, sans-serif" font-size="36" fill="url(#textGrad)" text-anchor="middle">DevOps Engineer | Cloud Enthusiast | Full Stack Developer</text>

  <text x="600" y="400" font-family="Arial, sans-serif" font-size="24" fill="white" fill-opacity="0.8" text-anchor="middle">Building Digital Solutions with Modern Technology</text>

  <!-- Website URL -->
  <rect x="450" y="480" width="300" height="50" rx="25" fill="white" fill-opacity="0.15"/>
  <text x="600" y="515" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle">zenbgs.github.io</text>

  <!-- Logo/Badge -->
  <rect x="50" y="530" width="60" height="60" rx="12" fill="white"/>
  <text x="80" y="572" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0ea5e9" text-anchor="middle">ZB</text>
</svg>
